name: Deploy to cloud.gov

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudgov-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- src/lib/database-runtime.test.ts src/lib/work-modes.test.ts src/lib/password.test.ts src/lib/impersonation.test.ts src/lib/contributor-profile.test.ts
      - name: Build standalone app
        run: npm run build
        env:
          CI: "false"
      - name: Install Cloud Foundry CLI
        run: |
          curl -fL --retry 3 "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=8.19.0&source=github-rel" -o "$RUNNER_TEMP/cf-cli.tgz"
          tar -xzf "$RUNNER_TEMP/cf-cli.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cf8" version
      - name: Migrate database and deploy app
        env:
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CF_USERNAME:?Set CF_USERNAME in the GitHub production environment}"
          : "${CF_PASSWORD:?Set CF_PASSWORD in the GitHub production environment}"
          cf8 api https://api.fr.cloud.gov
          cf8 auth "$CF_USERNAME" "$CF_PASSWORD"
          cf8 target -o epa-prototyping -s admin-training
          migration_app="epa-business-platform-migrate-${GITHUB_RUN_ID}"
          migration_task="prisma-migrate-${GITHUB_RUN_ID}"
          cf8 push "$migration_app" --no-manifest --task -p .
          cf8 set-env "$migration_app" NPM_CONFIG_PRODUCTION false
          cf8 bind-service "$migration_app" epa-db
          cf8 restage "$migration_app"
          cf8 run-task "$migration_app" --command "node scripts/cf-migrate.cjs --migrate-only" --name "$migration_task"

          app_guid="$(cf8 app "$migration_app" --guid)"
          task_state=""
          for attempt in $(seq 1 60); do
            task_state="$(cf8 curl "/v3/apps/${app_guid}/tasks?order_by=-created_at" | jq -r --arg name "$migration_task" '.resources[] | select(.name == $name) | .state' | head -n 1)"
            case "$task_state" in
              SUCCEEDED) break ;;
              FAILED)
                cf8 logs "$migration_app" --recent || true
                echo "Prisma migration task failed."
                exit 1
                ;;
            esac
            sleep 10
          done
          if [ "$task_state" != "SUCCEEDED" ]; then
            cf8 logs "$migration_app" --recent || true
            echo "Timed out waiting for Prisma migration task; last state: ${task_state:-unknown}."
            exit 1
          fi

          cf8 push epa-business-platform --no-manifest -p .
      - name: Remove migration task app
        if: always()
        run: |
          migration_app="epa-business-platform-migrate-${GITHUB_RUN_ID}"
          if cf8 app "$migration_app" >/dev/null 2>&1; then
            cf8 delete "$migration_app" --force --routes
          fi
